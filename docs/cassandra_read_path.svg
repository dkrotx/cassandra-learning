<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill:#ffffff; stroke:#111; stroke-width:1.5; rx:10; ry:10; }
      .title { font: 700 20px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans'; }
      .label { font: 400 16px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans'; }
      .mono  { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .arrow { stroke:#111; stroke-width:1.5; marker-end:url(#arrowhead); fill:none; }
      .note  { fill:#f6f9ff; stroke:#7aa2ff; }
      .emph  { fill:#fff8e1; stroke:#f0c14b; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="40" class="title">Cassandra Read Path &amp; Reconciliation (Shadowed Cells + Tombstones)</text>

  <!-- Client & Coordinator -->
  <rect x="40" y="70" width="230" height="70" class="box"/>
  <text x="55" y="100" class="label">Client Query</text>
  <text x="55" y="122" class="mono">SELECT ... WHERE partition_key=... [CL=LOCAL_QUORUM]</text>

  <rect x="320" y="70" width="260" height="70" class="box"/>
  <text x="335" y="100" class="label">Coordinator Node</text>
  <text x="335" y="122" class="mono">hash(partition_key) → token → replica set</text>

  <line x1="270" y1="105" x2="320" y2="105" class="arrow"/>

  <!-- Replica -->
  <rect x="620" y="60" width="740" height="220" class="box"/>
  <text x="635" y="90" class="label">Replica Node (per read)</text>

  <!-- Memtable / Row cache -->
  <rect x="640" y="110" width="260" height="60" class="box"/>
  <text x="655" y="143" class="label">Memtable / Row Cache</text>
  <text x="655" y="164" class="mono">fast path if present</text>

  <line x1="580" y1="105" x2="620" y2="105" class="arrow"/>

  <!-- SSTable loop -->
  <rect x="930" y="110" width="410" height="150" class="box"/>
  <text x="945" y="138" class="label">For Each SSTable:</text>
  <text x="960" y="160" class="mono">Bloom Filter → skip negatives</text>
  <text x="960" y="180" class="mono">Partition Summary/Index → jump to partition</text>
  <text x="960" y="200" class="mono">Promoted Index (~64KB blocks) → jump into clustering range</text>
  <text x="960" y="220" class="mono">Read blocks → collect candidate cells</text>

  <!-- Merge / reconcile -->
  <rect x="40" y="330" width="740" height="210" class="box emph"/>
  <text x="55" y="360" class="label">Merge &amp; Reconcile (per cell)</text>
  <text x="55" y="385" class="mono">• Compare timestamps across memtable + all SSTables → newest wins (shadowing)</text>
  <text x="55" y="408" class="mono">• Apply tombstones (row/partition/range/cell). If tombstone ts ≥ cell ts → suppress</text>
  <text x="55" y="431" class="mono">• Filter TTL-expired values (become tombstones)</text>
  <text x="55" y="454" class="mono">• Respect clustering slice (e.g., latest N via DESC order)</text>
  <text x="55" y="477" class="mono">⇒ Return only the live cells/rows</text>

  <line x1="840" y1="185" x2="780" y2="330" class="arrow"/>
  <line x1="1040" y1="260" x2="780" y2="330" class="arrow"/>

  <!-- Result -->
  <rect x="820" y="330" width="260" height="90" class="box"/>
  <text x="835" y="365" class="label">Replica → Coordinator</text>
  <text x="835" y="388" class="mono">merge replica responses per CL</text>
  <line x1="1080" y1="375" x2="1180" y2="375" class="arrow"/>

  <rect x="1200" y="330" width="160" height="90" class="box"/>
  <text x="1215" y="365" class="label">Coordinator → Client</text>
  <text x="1215" y="388" class="mono">final result set</text>

  <!-- Notes on amplification -->
  <rect x="40" y="580" width="1320" height="170" class="box note"/>
  <text x="55" y="610" class="label">Performance Notes &amp; Indexes</text>
  <text x="55" y="635" class="mono">• Fast path relies on PRIMARY KEY: partition key (routing) + clustering keys (order). Promoted index prunes inside partitions.</text>
  <text x="55" y="658" class="mono">• Read amplification ↑ with many SSTables per partition (choose LCS for low RA; TWCS for time-series).</text>
  <text x="55" y="681" class="mono">• Shadowed cells (older versions) ↑ with frequent overwrites; compaction drops them. Tombstones persist until gc_grace + compaction.</text>
  <text x="55" y="704" class="mono">• Secondary indexes: use sparingly. Prefer SAI (C* 5+) for selective filters; best performance comes from PK + clustering modeling.</text>
  <text x="55" y="727" class="mono">• Avoid wide/hot partitions; bucket/shard by time or hash to cap size and compaction/repair costs.</text>

  <!-- Compaction aside -->
  <rect x="820" y="450" width="540" height="120" class="box"/>
  <text x="835" y="480" class="label">Compaction (background)</text>
  <text x="835" y="505" class="mono">• Merges SSTables, drops shadowed cells immediately</text>
  <text x="835" y="528" class="mono">• Drops tombstones after gc_grace_seconds</text>
  <text x="835" y="551" class="mono">• LCS lowers read amp (more rewrites); TWCS suits TTL/time windows</text>

</svg>
